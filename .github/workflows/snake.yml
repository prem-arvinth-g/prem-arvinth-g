# Draws a snake eating the contribution graph and publishes it to the `output` branch.
name: snake

on:
  schedule:
    - cron: "30 18 * * *" # every night, 00:00 IST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#7cffb2&color_dots=#0b1410,#0e4429,#006d32,#26a641,#39d353
            dist/snake-light.svg?color_snake=#05090c

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
