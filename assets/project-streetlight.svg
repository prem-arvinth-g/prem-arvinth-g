<svg xmlns="http://www.w3.org/2000/svg" width="490" height="212" viewBox="0 0 490 212" font-size="13" fill="#c9f7dc" role="img" aria-labelledby="title desc" xml:space="preserve">
<title id="title">Smart Streetlight Monitor</title>
<desc id="desc">Smart Streetlight Monitor. ESP32 nodes tell a bulb failure from a power failure and report every light to a live web dashboard. Built with ESP32 · Embedded C · LDR + current sensing.</desc>
<style>
text{font-family:'JetBrains Mono','Cascadia Code','Fira Code','SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;white-space:pre;font-variant-ligatures:none}
.g{fill:#39d353}.l{fill:#7cffb2}.d{fill:#5b8a70}.k{fill:#2f7a4f}.t{fill:#c9f7dc}.w{fill:#effff5}
.c{fill:#4fd6ff}.y{fill:#ffcc66}.r{fill:#ff5f87}.p{fill:#b69cff}.b{font-weight:700}
.a{animation:ap .01s linear both}
.f{animation:fu .5s ease-out both}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes ap{from{opacity:0}to{opacity:1}}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes tp{from{clip-path:inset(-6px 100% -6px 0)}to{clip-path:inset(-6px 0 -6px 0)}}
@keyframes show{from{opacity:0}to{opacity:1}}@keyframes hide{to{opacity:0}}
@keyframes mv15{from{transform:translateX(0)}to{transform:translateX(108px)}}
@keyframes run{to{stroke-dashoffset:-100}}.run{animation:run 7s linear -3.3000000000000003s infinite}</style>
<defs>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" fill-opacity=".18"/></pattern>
<radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset="62%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".5"/></radialGradient>
<filter id="glow" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="frame"><rect width="490" height="212" rx="12"/></clipPath>

</defs>
<g clip-path="url(#frame)">
<rect width="490" height="212" fill="#05090c"/>
<path d="M12 0h466a12 12 0 0 1 12 12v22h-490v-22a12 12 0 0 1 12-12z" fill="#0c1a15"/><path d="M0 34h490" stroke="#1c3a2e"/>
<circle cx="20" cy="17" r="4.5" fill="#ff5f57" fill-opacity=".8"/><circle cx="35" cy="17" r="4.5" fill="#febc2e" fill-opacity=".8"/><circle cx="50" cy="17" r="4.5" fill="#28c840" fill-opacity=".8"/>
<g font-size="11.5"><text x="66" y="21.5" textLength="75.9" lengthAdjust="spacingAndGlyphs" class="d">~/projects/</text><text x="141.9" y="21.5" textLength="117.3" lengthAdjust="spacingAndGlyphs" class="t">smart-streetlight</text></g>
<circle cx="437.3" cy="17" r="4.5" fill="#f34b7d"/><text x="468" y="21.5" text-anchor="end" font-size="11.5" class="d">C++</text>
<g font-size="12"><g style="animation:tp 0.47s steps(15) 0.65s both"><text x="20" y="60" textLength="7.2" lengthAdjust="spacingAndGlyphs" class="g b">$</text><text x="34.4" y="60" textLength="93.6" lengthAdjust="spacingAndGlyphs" class="d">cat README.md</text></g><g style="animation:show .01s 0.65s both, hide .01s 1.37s forwards"><rect style="animation:mv15 0.47s steps(15) 0.65s both" x="20" y="49.68" width="6.48" height="13.44" fill="#7cffb2" fill-opacity=".9"/></g></g>
<g class="f" style="animation-delay:1.32s"><g font-size="19" filter="url(#glow)"><text x="20" y="90" textLength="285" lengthAdjust="spacingAndGlyphs" class="l b">Smart Streetlight Monitor</text></g></g>
<g class="f" style="animation-delay:1.47s"><g font-size="12.5"><text x="20" y="116" textLength="420" lengthAdjust="spacingAndGlyphs" class="t">ESP32 nodes tell a bulb failure from a power failure and</text><text x="20" y="135" textLength="322.5" lengthAdjust="spacingAndGlyphs" class="t">report every light to a live web dashboard.</text></g></g>
<g class="f" style="animation-delay:1.62s"><g font-size="12"><text x="20" y="166" textLength="7.2" lengthAdjust="spacingAndGlyphs" class="g">►</text><text x="34.4" y="166" textLength="302.4" lengthAdjust="spacingAndGlyphs" class="c">ESP32 · Embedded C · LDR + current sensing</text></g></g>
<g class="f" style="animation-delay:1.77s"><rect x="20" y="180" width="82" height="19" rx="4" fill="#ffcc66" fill-opacity=".1" stroke="#ffcc66" stroke-opacity=".75"/><g font-size="11"><text fill="#ffcc66" x="28" y="193.5" textLength="66" lengthAdjust="spacingAndGlyphs" class="b">IEEE PAPER</text></g><rect x="110" y="180" width="82" height="19" rx="4" fill="#ffcc66" fill-opacity=".1" stroke="#ffcc66" stroke-opacity=".75"/><g font-size="11"><text fill="#ffcc66" x="118" y="193.5" textLength="66" lengthAdjust="spacingAndGlyphs" class="b">CONFERENCE</text></g><rect x="200" y="180" width="35.8" height="19" rx="4" fill="#7cffb2" fill-opacity=".1" stroke="#7cffb2" stroke-opacity=".75"/><g font-size="11"><text fill="#7cffb2" x="208" y="193.5" textLength="19.8" lengthAdjust="spacingAndGlyphs" class="b">IOT</text></g></g>
<rect class="run" x="1" y="1" width="488" height="210" rx="11.5" fill="none" stroke="#7cffb2" stroke-width="1.6" stroke-opacity=".8" pathLength="100" stroke-dasharray="7 93"/>
<rect width="490" height="212" fill="url(#scan)"/>
<rect width="490" height="212" fill="url(#vig)"/>
</g>
<rect x=".5" y=".5" width="489" height="211" rx="12" fill="none" stroke="#1c3a2e"/>
</svg>
