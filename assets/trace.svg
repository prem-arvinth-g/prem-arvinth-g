<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="306" viewBox="0 0 1000 306" font-size="13" fill="#c9f7dc" role="img" aria-labelledby="title desc" xml:space="preserve">
<title id="title">One request, three layers</title>
<desc id="desc">A request travels from an Angular front end to an ASP.NET Core API to SQL Server and back. Interface: Angular, TypeScript, HTML, CSS, React, Bootstrap. API: C#, ASP.NET Core Web API, Entity Framework, LINQ, Django REST. Data: SQL Server, T-SQL, stored procedures, MySQL, PostgreSQL, Power BI.</desc>
<style>
text{font-family:'JetBrains Mono','Cascadia Code','Fira Code','SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;white-space:pre;font-variant-ligatures:none}
.g{fill:#39d353}.l{fill:#7cffb2}.d{fill:#5b8a70}.k{fill:#2f7a4f}.t{fill:#c9f7dc}.w{fill:#effff5}
.c{fill:#4fd6ff}.y{fill:#ffcc66}.r{fill:#ff5f87}.p{fill:#b69cff}.b{font-weight:700}
.a{animation:ap .01s linear both}
.f{animation:fu .5s ease-out both}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes ap{from{opacity:0}to{opacity:1}}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes hl0{0%,100%{stroke-opacity:.12}0%{stroke-opacity:1}2%,4%{stroke-opacity:1}6%{stroke-opacity:0.12}92%{stroke-opacity:0.12}94%,98%{stroke-opacity:1}100%{stroke-opacity:1}}.hl0{animation:hl0 4.8s linear 1s infinite}
@keyframes hl1{0%,100%{stroke-opacity:.12}18%{stroke-opacity:0.12}20%,28%{stroke-opacity:1}30%{stroke-opacity:0.12}68%{stroke-opacity:0.12}70%,78%{stroke-opacity:1}80%{stroke-opacity:0.12}}.hl1{animation:hl1 4.8s linear 1s infinite}
@keyframes hl2{0%,100%{stroke-opacity:.12}42%{stroke-opacity:0.12}44%,54%{stroke-opacity:1}56%{stroke-opacity:0.12}}.hl2{animation:hl2 4.8s linear 1s infinite}
@keyframes pk0{0%,6%{transform:translateX(296px);opacity:0}6.1%{opacity:1}18%{transform:translateX(375px);opacity:1}18.1%,100%{transform:translateX(375px);opacity:0}}.pk0{animation:pk0 4.8s cubic-bezier(.5,0,.5,1) 1s infinite}
@keyframes pk1{0%,30%{transform:translateX(625px);opacity:0}30.1%{opacity:1}42%{transform:translateX(704px);opacity:1}42.1%,100%{transform:translateX(704px);opacity:0}}.pk1{animation:pk1 4.8s cubic-bezier(.5,0,.5,1) 1s infinite}
@keyframes pk2{0%,56%{transform:translateX(704px);opacity:0}56.1%{opacity:1}68%{transform:translateX(625px);opacity:1}68.1%,100%{transform:translateX(625px);opacity:0}}.pk2{animation:pk2 4.8s cubic-bezier(.5,0,.5,1) 1s infinite}
@keyframes pk3{0%,80%{transform:translateX(375px);opacity:0}80.1%{opacity:1}92%{transform:translateX(296px);opacity:1}92.1%,100%{transform:translateX(296px);opacity:0}}.pk3{animation:pk3 4.8s cubic-bezier(.5,0,.5,1) 1s infinite}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}.grow{transform-box:fill-box;transform-origin:left;animation:grow .5s ease-out both}</style>
<defs>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" fill-opacity=".18"/></pattern>
<radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset="62%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".5"/></radialGradient>
<filter id="glow" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="frame"><rect width="1000" height="306" rx="12"/></clipPath>

</defs>
<g clip-path="url(#frame)">
<rect width="1000" height="306" fill="#05090c"/>
<rect x="20" y="18" width="960" height="270" rx="10" fill="#08110f" fill-opacity=".9" stroke="#1c3a2e"/>
<path d="M30 18h940a10 10 0 0 1 10 10v20h-960v-20a10 10 0 0 1 10-10z" fill="#0c1a15"/>
<path d="M20 48h960" stroke="#1c3a2e"/>
<circle cx="40" cy="33" r="5.5" fill="#ff5f57" fill-opacity=".85"/>
<circle cx="58" cy="33" r="5.5" fill="#febc2e" fill-opacity=".85"/>
<circle cx="76" cy="33" r="5.5" fill="#28c840" fill-opacity=".85"/>
<text x="500" y="37.5" text-anchor="middle" font-size="12" class="d">trace — one request, three layers</text>
<circle class="pulse" cx="906.8" cy="33" r="4" fill="#39d353"/><text x="962" y="37.5" text-anchor="end" font-size="11.5" class="g b">200 OK</text>
<g font-size="14"><g class="a" style="animation-delay:0.2s"><text x="46" y="76" textLength="25.2" lengthAdjust="spacingAndGlyphs" class="l b">GET</text><text x="79.6" y="76" textLength="235.2" lengthAdjust="spacingAndGlyphs" class="w">/api/developers/prem-arvinth</text><text x="340" y="76" textLength="25.2" lengthAdjust="spacingAndGlyphs" class="d">──►</text><text x="390.4" y="76" textLength="50.4" lengthAdjust="spacingAndGlyphs" class="g b">200 OK</text><text x="457.6" y="76" textLength="92.4" lengthAdjust="spacingAndGlyphs" class="d">·  48 ms  ·</text><text x="566.8" y="76" textLength="302.4" lengthAdjust="spacingAndGlyphs" class="d">every feature I ship takes this path</text></g></g>
<g class="f" style="animation-delay:0.4s">
<rect x="46" y="98" width="250" height="118" rx="8" fill="#0c1a15" stroke="#1c3a2e"/>
<rect class="hl0" x="46" y="98" width="250" height="118" rx="8" fill="none" stroke="#ff5f87" stroke-width="1.6" stroke-opacity=".12"/>
<g font-size="11"><text x="62" y="122" textLength="92.4" lengthAdjust="spacingAndGlyphs" class="d b">01 · INTERFACE</text></g>
<g font-size="21"><text x="62" y="152" textLength="88.2" lengthAdjust="spacingAndGlyphs" class="r b">Angular</text></g>
<g font-size="12.5"><text x="62" y="178" textLength="172.5" lengthAdjust="spacingAndGlyphs" class="t">TypeScript · HTML · CSS</text><text x="62" y="198" textLength="127.5" lengthAdjust="spacingAndGlyphs" class="d">React · Bootstrap</text></g>
</g>
<g class="f" style="animation-delay:0.65s">
<rect x="375" y="98" width="250" height="118" rx="8" fill="#0c1a15" stroke="#1c3a2e"/>
<rect class="hl1" x="375" y="98" width="250" height="118" rx="8" fill="none" stroke="#b69cff" stroke-width="1.6" stroke-opacity=".12"/>
<g font-size="11"><text x="391" y="122" textLength="52.8" lengthAdjust="spacingAndGlyphs" class="d b">02 · API</text></g>
<g font-size="21"><text x="391" y="152" textLength="151.2" lengthAdjust="spacingAndGlyphs" class="p b">ASP.NET Core</text></g>
<g font-size="12.5"><text x="391" y="178" textLength="187.5" lengthAdjust="spacingAndGlyphs" class="t">C# · Web API · REST · MVC</text><text x="391" y="198" textLength="210" lengthAdjust="spacingAndGlyphs" class="d">EF Core · LINQ · Django REST</text></g>
</g>
<g class="f" style="animation-delay:0.9s">
<rect x="704" y="98" width="250" height="118" rx="8" fill="#0c1a15" stroke="#1c3a2e"/>
<rect class="hl2" x="704" y="98" width="250" height="118" rx="8" fill="none" stroke="#ffcc66" stroke-width="1.6" stroke-opacity=".12"/>
<g font-size="11"><text x="720" y="122" textLength="59.4" lengthAdjust="spacingAndGlyphs" class="d b">03 · DATA</text></g>
<g font-size="21"><text x="720" y="152" textLength="126" lengthAdjust="spacingAndGlyphs" class="y b">SQL Server</text></g>
<g font-size="12.5"><text x="720" y="178" textLength="187.5" lengthAdjust="spacingAndGlyphs" class="t">T-SQL · stored procedures</text><text x="720" y="198" textLength="217.5" lengthAdjust="spacingAndGlyphs" class="d">MySQL · PostgreSQL · Power BI</text></g>
</g>
<path d="M300 157H371" stroke="#5b8a70" stroke-dasharray="3 4"/><path d="M629 157H700" stroke="#5b8a70" stroke-dasharray="3 4"/>
<g class="pk0" style="opacity:0"><circle cx="0" cy="157" r="5" fill="#7cffb2" filter="url(#glow)"/><circle cx="-12" cy="157" r="2.5" fill="#7cffb2" fill-opacity=".5"/></g>
<g class="pk1" style="opacity:0"><circle cx="0" cy="157" r="5" fill="#7cffb2" filter="url(#glow)"/><circle cx="-12" cy="157" r="2.5" fill="#7cffb2" fill-opacity=".5"/></g>
<g class="pk2" style="opacity:0"><circle cx="0" cy="157" r="5" fill="#ffcc66" filter="url(#glow)"/><circle cx="12" cy="157" r="2.5" fill="#ffcc66" fill-opacity=".5"/></g>
<g class="pk3" style="opacity:0"><circle cx="0" cy="157" r="5" fill="#ffcc66" filter="url(#glow)"/><circle cx="12" cy="157" r="2.5" fill="#ffcc66" fill-opacity=".5"/></g>
<rect x="46" y="240" width="908" height="8" rx="2" fill="#0c1a15"/>
<rect class="grow" style="animation-delay:1s" x="46" y="240" width="225" height="8" rx="2" fill="#ff5f87" fill-opacity=".85"/>
<g class="a" style="animation-delay:1.3s"><g font-size="11.5"><text x="46" y="266" textLength="82.8" lengthAdjust="spacingAndGlyphs" class="d">angular 12ms</text></g></g>
<rect class="grow" style="animation-delay:1.5s" x="273" y="240" width="452" height="8" rx="2" fill="#b69cff" fill-opacity=".85"/>
<g class="a" style="animation-delay:1.8s"><g font-size="11.5"><text x="273" y="266" textLength="117.3" lengthAdjust="spacingAndGlyphs" class="d">asp.net core 24ms</text></g></g>
<rect class="grow" style="animation-delay:2s" x="727" y="240" width="225" height="8" rx="2" fill="#ffcc66" fill-opacity=".85"/>
<g class="a" style="animation-delay:2.3s"><g font-size="11.5"><text x="727" y="266" textLength="103.5" lengthAdjust="spacingAndGlyphs" class="d">sql server 12ms</text></g></g>
<rect width="1000" height="306" fill="url(#scan)"/>
<rect width="1000" height="306" fill="url(#vig)"/>
</g>
<rect x=".5" y=".5" width="999" height="305" rx="12" fill="none" stroke="#1c3a2e"/>
</svg>
