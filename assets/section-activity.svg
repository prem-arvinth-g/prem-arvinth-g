<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="58" viewBox="0 0 1000 58" font-size="13" fill="#c9f7dc" role="img" aria-labelledby="title desc" xml:space="preserve">
<title id="title">Contribution snake</title>
<desc id="desc">Contribution snake</desc>
<style>
text{font-family:'JetBrains Mono','Cascadia Code','Fira Code','SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;white-space:pre;font-variant-ligatures:none}
.g{fill:#39d353}.l{fill:#7cffb2}.d{fill:#5b8a70}.k{fill:#2f7a4f}.t{fill:#c9f7dc}.w{fill:#effff5}
.c{fill:#4fd6ff}.y{fill:#ffcc66}.r{fill:#ff5f87}.p{fill:#b69cff}.b{font-weight:700}
.a{animation:ap .01s linear both}
.f{animation:fu .5s ease-out both}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes ap{from{opacity:0}to{opacity:1}}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes tp{from{clip-path:inset(-6px 100% -6px 0)}to{clip-path:inset(-6px 0 -6px 0)}}
@keyframes show{from{opacity:0}to{opacity:1}}@keyframes hide{to{opacity:0}}
@keyframes mv46{from{transform:translateX(0)}to{transform:translateX(414px)}}</style>
<defs>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" fill-opacity=".18"/></pattern>
<radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset="62%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".5"/></radialGradient>
<filter id="glow" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="frame"><rect width="1000" height="58" rx="12"/></clipPath>

</defs>
<g clip-path="url(#frame)">
<rect width="1000" height="58" fill="#05090c"/>
<g font-size="15"><g style="animation:tp 1.77s steps(46) 0.2s both"><text x="24" y="35" textLength="9" lengthAdjust="spacingAndGlyphs" class="g b">$</text><text x="42" y="35" textLength="126" lengthAdjust="spacingAndGlyphs" class="w">watch -n 86400</text><text x="177" y="35" textLength="261" lengthAdjust="spacingAndGlyphs" class="c">./snake --eat ~/contributions</text></g><g style="animation:show .01s 0.2s both"><rect style="animation:mv46 1.77s steps(46) 0.2s both, blink 1.1s steps(1) 1.97s infinite" x="24" y="22.1" width="8.1" height="16.8" fill="#7cffb2" fill-opacity=".9"/></g></g>
<g class="a" style="animation-delay:1.97s"><text x="976" y="34" text-anchor="end" font-size="12" class="d">regenerated every night by GitHub Actions</text></g>
<path d="M24 46H976" stroke="#1c3a2e" stroke-dasharray="2 4"/>
<rect width="1000" height="58" fill="url(#scan)"/>
<rect width="1000" height="58" fill="url(#vig)"/>
</g>
<rect x=".5" y=".5" width="999" height="57" rx="12" fill="none" stroke="#1c3a2e"/>
</svg>
