@keyframes mv53{from{transform:translateX(0)}to{transform:translateX(445.2px)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes ring{from{r:6px;opacity:.9}to{r:16px;opacity:0}}.ring{animation:ring 1.8s ease-out infinite}</style>
