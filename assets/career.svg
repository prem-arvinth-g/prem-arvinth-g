<title id="title">Career, as a git log</title>
<desc id="desc">git log --graph of my career, newest first. Aug 2026: joined Russell Tobin as Software Developer. Jul 2026: student management system in ASP.NET Core MVC. 2026: final-year project, ESP32 smart streetlight fault detector with a live dashboard, IEEE-format paper and conference talk. 2025: Django e-commerce site on PythonAnywhere and a YOLOv8 number plate reader; won the college hackathon with an image classifier; Power BI dashboards, SQL window functions and Pandas. 2022: started B.E. Electronics and Communication Engineering.</desc>
